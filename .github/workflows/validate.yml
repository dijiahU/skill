name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Repository checks
        run: python3 scripts/check_repository.py

      - name: Framework regression tests
        run: python3 -m unittest discover -s tests -v

      - name: DSH adapter and isolated installer
        run: node --test tests/test_dsh_adapter.mjs

      - name: Codex backstop configuration
        run: |
          python3 - <<'PYCONFIG'
          import tomllib
          with open('adapters/codex/config.backstop.toml', 'rb') as stream:
              config = tomllib.load(stream)
          assert config['sandbox_mode'] == 'workspace-write'
          assert config['approval_policy'] == 'on-request'
          assert config['features']['hooks'] is True
          assert config['sandbox_workspace_write']['network_access'] is False
          PYCONFIG

      - name: Codex installer uses current user-skill location
        run: |
          trial="$RUNNER_TEMP/codex-install"
          mkdir -p "$trial/skills" "$trial/codex-home"
          SAFETY_ORCH_CODEX_SKILLS_DIR="$trial/skills" CODEX_HOME="$trial/codex-home" ./install.sh --host codex
          test -f "$trial/skills/safety-router-skill/SKILL.md"
          test -f "$trial/skills/safety-router-skill/helpers/health_status.py"
          test ! -e "$trial/codex-home/skills/safety-router-skill"
          test -f "$trial/codex-home/hooks.json"
          echo "codex skill discovery layout ok"

      - name: Codex bridge denies a destructive call
        run: |
          export SAFETY_ORCH_STATUS_DIR="$RUNNER_TEMP/codex-hook-state"
          export SAFETY_ORCH_MANUAL_BRIDGE=1
          mkdir -p "$SAFETY_ORCH_STATUS_DIR"
          out=$(echo '{"hook_event_name":"PreToolUse","session_id":"ci-session","turn_id":"ci-turn","tool_name":"Bash","tool_input":{"command":"rm --recursive -- /home"}}' \
                | python3 adapters/codex/codex_hook.py; echo "EXIT=$?")
          echo "$out"
          echo "$out" | grep -q '"permissionDecision": "deny"' || { echo "FAIL: not denied"; exit 1; }
          echo "$out" | grep -q 'EXIT=2' || { echo "FAIL: exit code not 2"; exit 1; }

          retry=$(echo '{"hook_event_name":"PreToolUse","session_id":"ci-session","turn_id":"ci-turn","tool_name":"Bash","tool_input":{"command":"printf safe"}}' \
                  | python3 adapters/codex/codex_hook.py; echo "EXIT=$?")
          echo "$retry"
          echo "$retry" | grep -q 'EXIT=0' || { echo "FAIL: safe recovery was denied"; exit 1; }
          echo "$retry" | grep -q '"recovery_policy": "recheck"' || { echo "FAIL: default recovery policy missing"; exit 1; }

          echo '{"hook_event_name":"Stop","session_id":"ci-session","turn_id":"ci-turn"}' \
            | python3 adapters/codex/codex_hook.py
          after_stop=$(echo '{"hook_event_name":"PreToolUse","session_id":"ci-session","turn_id":"ci-turn","tool_name":"Bash","tool_input":{"command":"printf safe"}}' \
                       | python3 adapters/codex/codex_hook.py; echo "EXIT=$?")
          echo "$after_stop" | grep -q 'EXIT=0' || { echo "FAIL: Stop did not release latch"; exit 1; }
          echo "codex bridge blocks unsafe actions and rechecks safe recovery"
